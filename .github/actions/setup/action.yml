name: Setup Node & pnpm
description: >
  Installs pnpm (matching package.json's packageManager pin), sets up Node
  20.11+ (matching package.json's engines field) with pnpm store caching, and
  installs dependencies with a frozen lockfile. Shared by every job in
  ci.yml so the toolchain is defined once.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - uses: actions/setup-node@v4
      with:
        node-version: '20.11'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
