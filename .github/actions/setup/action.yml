name: Setup Node & pnpm
description: >
  Installs pnpm (matching package.json's packageManager pin), sets up Node
  22 (matching package.json's engines field) with pnpm store caching, and
  installs dependencies with a frozen lockfile. Shared by every job in
  ci.yml so the toolchain is defined once. Node 20 reached end-of-life on
  2026-04-30 and no longer receives security updates, so CI tracks the
  current maintained LTS instead.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
